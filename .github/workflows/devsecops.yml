name: DevSecOps Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------
  # 1) Testes automatizados (regressao antes de qualquer scan de seguranca)
  # ---------------------------------------------------------------------
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  # ---------------------------------------------------------------------
  # 2) SAST - analise estatica do codigo (Bandit)
  # ---------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Bandit
        run: pip install bandit
      - name: Rodar SAST (Bandit)
        run: bandit -r app -f json -o bandit-report.json || true
      - name: Publicar relatorio SAST
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit-report
          path: bandit-report.json
      - name: Falhar em achados de severidade alta
        run: bandit -r app -ll

  # ---------------------------------------------------------------------
  # 3) SCA - analise de dependencias vulneraveis (pip-audit)
  # ---------------------------------------------------------------------
  sca:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: Rodar SCA (pip-audit)
        run: pip-audit -r requirements.txt -f json -o sca-report.json || true
      - name: Publicar relatorio SCA
        uses: actions/upload-artifact@v4
        with:
          name: sca-pip-audit-report
          path: sca-report.json

  # ---------------------------------------------------------------------
  # 4) Secret Scanning - segredos vazados no historico/commit (Gitleaks)
  # ---------------------------------------------------------------------
  secret_scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 5) Container Scan - vulnerabilidades na imagem Docker (Trivy)
  # ---------------------------------------------------------------------
  container_scan:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t sprint-soa-cyber:ci .
      - name: Rodar Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "sprint-soa-cyber:ci"
          format: "sarif"
          output: "trivy-report.sarif"
          severity: "CRITICAL,HIGH"
      - name: Publicar relatorio de container scan
        uses: actions/upload-artifact@v4
        with:
          name: container-trivy-report
          path: trivy-report.sarif
      - name: Upload SARIF para aba Security do GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-report.sarif"
