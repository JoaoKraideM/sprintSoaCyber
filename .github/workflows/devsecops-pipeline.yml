name: DevSecOps Pipeline - Ford Challenge

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write


# =========================================================
# 1. TESTES AUTOMATIZADOS
# =========================================================

jobs:

  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          python -m pytest tests/ -v


# =========================================================
# 2. SAST
# =========================================================

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      # Gera evidência mesmo se encontrar problema
      - name: Gerar relatório SAST
        run: |
          bandit -r app -f json -o bandit-report.json || true

      - name: Publicar relatório SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-bandit-report
          path: bandit-report.json

      # Security gate
      - name: Validar vulnerabilidades SAST
        run: |
          bandit -r app -ll


# =========================================================
# 3. SCA
# =========================================================

  sca:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      # Primeiro gera o relatório
      - name: Gerar relatório SCA
        run: |
          pip-audit \
            -r requirements.txt \
            -f json \
            -o pip-audit-report.json || true

      - name: Publicar relatório SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-pip-audit-report
          path: pip-audit-report.json

      # Depois funciona como security gate
      - name: Validar dependências
        run: |
          pip-audit -r requirements.txt


# =========================================================
# 4. SECRET SCANNING
# =========================================================

  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# =========================================================
# 5. CONTAINER SECURITY
# =========================================================

  container-security:
    name: Container Security - Trivy
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build \
            -t sprint-soa-cyber:${{ github.sha }} \
            .

      # -----------------------------------------------------
      # Vulnerabilidades da imagem
      # -----------------------------------------------------

      - name: Gerar relatório Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sprint-soa-cyber:${{ github.sha }}"
          format: "sarif"
          output: "trivy-report.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Publicar relatório Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-trivy-report
          path: trivy-report.sarif

      - name: Enviar relatório para GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-report.sarif"

      # -----------------------------------------------------
      # IaC / Dockerfile
      # -----------------------------------------------------

      - name: Verificar configuração Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

# =========================================================
# 6. RESUMO
# =========================================================

  resumo:
    name: Resultado DevSecOps
    runs-on: ubuntu-latest

    needs:
      - testes
      - sast
      - sca
      - secret-scanning
      - container-security

    if: always()

    steps:
      - name: Resultado do pipeline
        run: |
          echo "======================================"
          echo "Pipeline DevSecOps - Ford Challenge"
          echo "======================================"

          echo "Testes: ${{ needs.testes.result }}"
          echo "SAST: ${{ needs.sast.result }}"
          echo "SCA: ${{ needs.sca.result }}"
          echo "Secret Scanning: ${{ needs.secret-scanning.result }}"
          echo "Container Security: ${{ needs.container-security.result }}"

          echo "======================================"