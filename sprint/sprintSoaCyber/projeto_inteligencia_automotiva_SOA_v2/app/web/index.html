<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inteligencia Competitiva Automotiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="institucional-header">
    <div class="header-content">
      <p class="header-top">Desafio 01</p>
      <h1>Plataforma de Inteligencia Competitiva Automotiva</h1>
      <p class="header-sub">Arquitetura SOA + Cybersecurity: cadastro, autenticacao JWT e upload de Excel.</p>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <h2>Criar Usuario</h2>
      <form id="form-register">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" required maxlength="120" />

        <label for="register-password">Senha</label>
        <input id="register-password" type="password" required minlength="8" maxlength="120" />

        <button type="submit">Cadastrar</button>
      </form>
      <p class="feedback" id="register-feedback"></p>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form id="form-login">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required maxlength="120" />

        <label for="login-password">Senha</label>
        <input id="login-password" type="password" required minlength="8" maxlength="120" />

        <button type="submit">Entrar</button>
      </form>
      <p class="feedback" id="login-feedback"></p>
    </section>

    <section class="card card-upload">
      <h2>Envio de Excel</h2>
      <p class="helper">Somente .xlsx ou .xls, com validacao de tipo, tamanho e autenticacao.</p>
      <form id="form-upload">
        <label for="arquivo-excel">Arquivo Excel</label>
        <input id="arquivo-excel" type="file" accept=".xlsx,.xls" required />
        <button type="submit">Enviar arquivo</button>
      </form>
      <p class="feedback" id="upload-feedback"></p>
    </section>
  </main>

  <section class="token-area">
    <h3>Estado de autenticacao</h3>
    <p id="token-status">Sem token ativo.</p>
    <button id="logout-btn" type="button">Limpar sessao</button>
  </section>

  <script src="/static/app.js" defer></script>
</body>
</html>
